<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>KAGEROU-NET // BREACH CONSOLE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#05070a;
    --panel: rgba(11,15,19,0.92);
    --line:#1D2731;
    --green:#35F1A0;
    --green-dim:#1E7A56;
    --amber:#FFB238;
    --red:#FF4B5C;
    --text:#C9D6DD;
    --text-dim:#5C7280;
    --cyan:#4FD3E8;
    --magenta:#c98bff;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; }
  body{
    background: var(--bg);
    color: var(--text);
    font-family:'Zen Kaku Gothic New', sans-serif;
    overflow:hidden;
    position:relative;
  }
  .mono{ font-family:'JetBrains Mono', monospace; }
  canvas#matrix{
    position:fixed; inset:0; z-index:0; opacity:0.4; pointer-events:none;
  }
  body::after{
    content:"";
    position:fixed; inset:0;
    background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.65) 100%);
    pointer-events:none; z-index: 40;
  }
  body::before{
    content:"";
    position:fixed; inset:0;
    background: repeating-linear-gradient(0deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 3px);
    pointer-events:none; z-index: 41;
  }
  .frame{
    position:relative; z-index:5;
    display:flex; flex-direction:column;
    height:100vh; padding:10px; gap:8px;
  }

  /* ---- TOPBAR ---- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    border:1px solid var(--line); background: linear-gradient(180deg, rgba(18,24,31,0.95), rgba(13,18,22,0.95));
    padding:9px 16px; flex-shrink:0;
  }
  .sysname{ font-family:'Rajdhani',sans-serif; font-weight:700; font-size:20px; letter-spacing:0.14em; color:var(--green); text-shadow:0 0 10px rgba(53,241,160,0.45); animation: flicker 6s infinite; }
  @keyframes flicker{ 0%,100%{opacity:1;} 92%{opacity:1;} 93%{opacity:0.55;} 94%{opacity:1;} 96%{opacity:0.7;} 97%{opacity:1;} }
  .sysname small{ display:block; font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--text-dim); letter-spacing:0.1em; font-weight:400; margin-top:2px; }
  .topbar-right{ display:flex; align-items:center; gap:20px; font-size:12px; flex-wrap:wrap; justify-content:flex-end; }
  .status-dot{ display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--green); margin-right:6px; box-shadow:0 0 6px var(--green); animation: pulse 1.6s infinite; }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:0.35;} }
  #clock{ color:var(--green); letter-spacing:0.05em; }
  #cipherName{ color:var(--magenta); }

  /* ---- CONSOLE GRID ---- */
  .console{
    flex:1; min-height:0;
    display:grid;
    grid-template-columns: 250px 1fr 300px;
    gap:8px;
  }
  .panel{
    border:1px solid var(--line); background: var(--panel);
    display:flex; flex-direction:column; min-height:0;
    backdrop-filter: blur(1px);
  }
  .panel-head{
    padding:8px 12px; border-bottom:1px solid var(--line);
    font-size:11px; letter-spacing:0.12em; color:var(--text-dim); text-transform:uppercase;
    display:flex; justify-content:space-between; align-items:center; flex-shrink:0;
  }
  .panel-head .n{ color:var(--cyan); }

  /* ---- SYSTEM MONITOR ---- */
  .mon-body{ padding:12px; overflow-y:auto; flex:1; }
  .mon-metric{ margin-bottom:14px; }
  .mon-metric .lbl{ display:flex; justify-content:space-between; font-size:10.5px; color:var(--text-dim); letter-spacing:0.06em; margin-bottom:5px; }
  .mon-metric .lbl b{ color:var(--cyan); font-family:'JetBrains Mono',monospace; font-weight:500; }
  .mon-bar{ height:5px; background:#131a20; overflow:hidden; }
  .mon-bar i{ display:block; height:100%; background:linear-gradient(90deg,var(--green-dim),var(--green)); transition:width .6s ease; }
  .mon-bar.warn i{ background:linear-gradient(90deg,#7a5a1e,var(--amber)); }
  .proc-title{ font-size:10px; color:var(--text-dim); letter-spacing:0.1em; margin:16px 0 6px; }
  .proc-row{ display:flex; justify-content:space-between; font-family:'JetBrains Mono',monospace; font-size:10.5px; padding:4px 0; border-bottom:1px solid #151c22; color:var(--text-dim); }
  .proc-row span:first-child{ color:var(--text); }

  /* ---- TERMINAL ---- */
  .term-body{ flex:1; min-height:0; display:flex; flex-direction:column; padding:12px 14px; }
  .term-scroll{ flex:1; overflow-y:auto; font-family:'JetBrains Mono',monospace; font-size:12.5px; line-height:1.75; }
  .term-scroll .ln{ white-space:pre-wrap; word-break:break-all; color:var(--text); }
  .term-scroll .cmdline{ color:var(--cyan); }
  .term-scroll .out{ color:var(--green); }
  .term-scroll .out2{ color:var(--text-dim); }
  .term-scroll .warnln{ color:var(--amber); }
  .term-scroll .errln{ color:var(--red); }
  .term-input-row{ display:flex; align-items:center; gap:8px; margin-top:8px; border-top:1px solid var(--line); padding-top:10px; flex-shrink:0; }
  .prompt{ color:var(--green); font-family:'JetBrains Mono',monospace; font-size:12.5px; flex-shrink:0; }
  #termInput{ flex:1; background:transparent; border:none; color:var(--text); font-family:'JetBrains Mono',monospace; font-size:12.5px; }
  #termInput:focus{ outline:none; }
  .cursor{ display:inline-block; width:7px; height:14px; background:var(--green); margin-left:2px; animation: blink 1s step-end infinite; vertical-align:middle; }
  @keyframes blink{ 50%{ opacity:0; } }

  /* ---- NETWORK MAP ---- */
  .net-wrap{ flex:1; min-height:0; position:relative; overflow:hidden; }
  .net-svg{ width:100%; height:100%; }
  .net-line{ stroke:#1D2731; stroke-width:1; }
  .net-line.live{ stroke:var(--green); stroke-width:1.2; stroke-dasharray:4 5; animation: dash 1.4s linear infinite; opacity:0.8; }
  @keyframes dash{ to{ stroke-dashoffset:-18; } }
  .net-node circle{ fill:var(--green); }
  .net-node.core circle{ fill:var(--cyan); }
  .net-node text{ font-family:'JetBrains Mono',monospace; font-size:8px; fill:var(--text-dim); }

  /* ---- DECRYPTOR ---- */
  .decrypt-body{ padding:12px; border-top:1px solid var(--line); flex-shrink:0; }
  .decrypt-body input{ width:100%; background:#0D1318; border:1px solid var(--line); color:var(--text); padding:8px 10px; font-family:'JetBrains Mono',monospace; font-size:12px; margin-bottom:8px; }
  .decrypt-body input:focus{ outline:none; border-color:var(--magenta); }
  .decrypt-out{ font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--magenta); min-height:18px; word-break:break-all; margin-top:6px; }
  .btn{ border:none; background:var(--green); color:#06130D; font-weight:700; padding:8px 16px; font-family:'JetBrains Mono',monospace; font-size:12px; cursor:pointer; letter-spacing:0.04em; width:100%; }
  .btn:hover{ background:#4dffb0; }

  /* ---- PACKET STREAM ---- */
  .packetbar{ height:110px; border:1px solid var(--line); background:var(--panel); flex-shrink:0; display:flex; flex-direction:column; }
  .packet-feed{ flex:1; overflow-y:auto; padding:6px 12px; font-family:'JetBrains Mono',monospace; font-size:10px; line-height:1.65; color:var(--text-dim); }
  .packet-feed .ip{ color:var(--cyan); }
  .packet-feed .hex{ color:var(--green-dim); }
  .packet-feed .flag{ color:var(--red); }

  ::-webkit-scrollbar{ width:6px; }
  ::-webkit-scrollbar-thumb{ background:var(--line); }

  @media (max-width:900px){
    body{ overflow-y:auto; }
    .frame{ height:auto; min-height:100vh; }
    .console{ grid-template-columns:1fr; grid-template-rows:200px 52vh 260px; }
    .packetbar{ height:110px; }
  }
</style>
</head>
<body>
<canvas id="matrix"></canvas>
<div class="frame">

  <div class="topbar">
    <div class="sysname">KAGEROU-NET<small>BREACH CONSOLE</small></div>
    <div class="topbar-right mono">
      <div><span class="status-dot"></span>LINK ACTIVE</div>
      <div>CIPHER: <span id="cipherName">AES-256</span></div>
      <div id="clock">--:--:--</div>
    </div>
  </div>

  <div class="console">
    <!-- SYSTEM MONITOR -->
    <div class="panel">
      <div class="panel-head">SYSTEM MONITOR <span class="n mono">LIVE</span></div>
      <div class="mon-body" id="monBody">
        <div class="mon-metric"><div class="lbl">CPU<b id="mCpuVal">0%</b></div><div class="mon-bar"><i id="mCpu"></i></div></div>
        <div class="mon-metric"><div class="lbl">MEM<b id="mMemVal">0%</b></div><div class="mon-bar"><i id="mMem"></i></div></div>
        <div class="mon-metric"><div class="lbl">NET I/O<b id="mNetVal">0 KB/s</b></div><div class="mon-bar"><i id="mNet"></i></div></div>
        <div class="mon-metric"><div class="lbl">ENCRYPT LOAD<b id="mEncVal">0%</b></div><div class="mon-bar warn"><i id="mEnc"></i></div></div>
        <div class="proc-title">PROCESSES</div>
        <div id="procList"></div>
      </div>
    </div>

    <!-- TERMINAL -->
    <div class="panel">
      <div class="panel-head">INTERACTIVE TERMINAL <span class="n mono">type help for commands</span></div>
      <div class="term-body">
        <div class="term-scroll" id="termScroll"></div>
        <div class="term-input-row">
          <span class="prompt">root@kagerou:~$</span>
          <input id="termInput" class="mono" autocomplete="off" spellcheck="false">
        </div>
      </div>
    </div>

    <!-- NETWORK + DECRYPT -->
    <div class="panel">
      <div class="panel-head">NETWORK MAP <span class="n mono" id="netStat">SCANNING</span></div>
      <div class="net-wrap">
        <svg class="net-svg" viewBox="0 0 300 300" id="netSvg"></svg>
      </div>
      <div class="panel-head">DECRYPTOR <span class="n mono">DEMO</span></div>
      <div class="decrypt-body">
        <input id="decInput" type="text" placeholder="Enter text to decrypt..." value="TOP-SECRET-PAYLOAD">
        <button class="btn" id="decBtn">RUN DECRYPT</button>
        <div class="decrypt-out" id="decOut"></div>
      </div>
    </div>
  </div>

  <div class="packetbar">
    <div class="panel-head">PACKET STREAM <span class="n mono">CAPTURE</span></div>
    <div class="packet-feed" id="packetFeed"></div>
  </div>

</div>

<script>
/* ================= Matrix background ================= */
const canvas = document.getElementById('matrix');
const ctx = canvas.getContext('2d');
let W, H, cols, drops;
const CHARS = '01ABCDEFGHIJKLMNOPQRSTUVWXYZ$#%&@*+-<>/\\';
function resizeCanvas(){
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  cols = Math.floor(W / 16);
  drops = new Array(cols).fill(0).map(()=> Math.random()*-40);
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);
function drawMatrix(){
  ctx.fillStyle = 'rgba(5,7,10,0.15)';
  ctx.fillRect(0,0,W,H);
  ctx.fillStyle = '#35F1A0';
  ctx.font = '14px monospace';
  for(let i=0;i<cols;i++){
    const ch = CHARS[Math.floor(Math.random()*CHARS.length)];
    ctx.fillText(ch, i*16, drops[i]*16);
    if(drops[i]*16 > H && Math.random() > 0.975) drops[i] = 0;
    drops[i]++;
  }
  requestAnimationFrame(drawMatrix);
}
drawMatrix();

/* ================= Clock ================= */
function tickClock(){
  document.getElementById('clock').textContent = new Date().toLocaleTimeString('ja-JP',{hour12:false}) + ' JST';
}
tickClock(); setInterval(tickClock, 1000);
const ciphers = ['AES-256','RSA-4096','ChaCha20','SHA3-512','ECC-P521','Twofish-256'];
setInterval(()=>{ document.getElementById('cipherName').textContent = ciphers[Math.floor(Math.random()*ciphers.length)]; }, 4000);

/* ================= System monitor ================= */
function rand(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
function updateMonitor(){
  const cpu = rand(18,92), mem = rand(30,85), net = rand(2,980), enc = rand(10,70);
  document.getElementById('mCpu').style.width = cpu+'%';
  document.getElementById('mCpuVal').textContent = cpu+'%';
  document.getElementById('mMem').style.width = mem+'%';
  document.getElementById('mMemVal').textContent = mem+'%';
  document.getElementById('mNet').style.width = Math.min(100, net/10)+'%';
  document.getElementById('mNetVal').textContent = net+' KB/s';
  document.getElementById('mEnc').style.width = enc+'%';
  document.getElementById('mEncVal').textContent = enc+'%';
}
updateMonitor(); setInterval(updateMonitor, 1800);

const PROC_NAMES = ['kd_daemon','netlisten','cryptcore','tunnel0','packetd','authproxy','relaymesh','shadowfs','vpnbridge','logshred'];
function updateProcs(){
  const rows = [];
  for(let i=0;i<6;i++){
    rows.push(`<div class="proc-row"><span>${PROC_NAMES[rand(0,PROC_NAMES.length-1)]}</span><span>${rand(1000,9999)} / ${rand(0,40)}%</span></div>`);
  }
  document.getElementById('procList').innerHTML = rows.join('');
}
updateProcs(); setInterval(updateProcs, 2600);

/* ================= Network map ================= */
const netSvg = document.getElementById('netSvg');
const netNodes = [];
const NODE_COUNT = 9;
for(let i=0;i<NODE_COUNT;i++){
  const angle = (i / NODE_COUNT) * Math.PI * 2;
  const r = 105;
  netNodes.push({ x: 150 + r*Math.cos(angle), y: 150 + r*Math.sin(angle), id:'NODE-'+ (10+i) });
}
function renderNet(){
  let svg = '';
  // core
  svg += `<g class="net-node core"><circle cx="150" cy="150" r="6"></circle><text x="158" y="146">CORE</text></g>`;
  netNodes.forEach((n) => {
    const live = Math.random() > 0.55;
    svg += `<line class="net-line ${live?'live':''}" x1="150" y1="150" x2="${n.x}" y2="${n.y}"></line>`;
  });
  netNodes.forEach((n) => {
    svg += `<g class="net-node"><circle cx="${n.x}" cy="${n.y}" r="3.5"></circle><text x="${n.x+6}" y="${n.y-6}">${n.id}</text></g>`;
  });
  netSvg.innerHTML = svg;
}
renderNet();
setInterval(renderNet, 1200);
const netStats = ['SCANNING','SYNC','IDLE','HANDSHAKE','ROUTING'];
setInterval(()=>{ document.getElementById('netStat').textContent = netStats[rand(0,netStats.length-1)]; }, 2000);

/* ================= Packet stream ================= */
const packetFeed = document.getElementById('packetFeed');
function randIp(){ return `${rand(10,223)}.${rand(0,255)}.${rand(0,255)}.${rand(1,254)}`; }
function randHex(len){ let s=''; for(let i=0;i<len;i++) s += rand(0,15).toString(16); return s; }
function addPacket(){
  const div = document.createElement('div');
  const flagged = Math.random() > 0.85;
  div.innerHTML = `<span class="ip">${randIp()}:${rand(1000,65000)}</span> → <span class="ip">${randIp()}:${rand(1,1024)}</span> <span class="hex">${randHex(16)}</span> ${flagged?'<span class="flag">[FLAGGED]</span>':''}`;
  packetFeed.appendChild(div);
  packetFeed.scrollTop = packetFeed.scrollHeight;
  while(packetFeed.children.length > 80) packetFeed.removeChild(packetFeed.firstChild);
}
setInterval(addPacket, 350);
for(let i=0;i<15;i++) addPacket();

/* ================= Decryptor ================= */
const decBtn = document.getElementById('decBtn');
const decInput = document.getElementById('decInput');
const decOut = document.getElementById('decOut');
const SCRAMBLE = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*';
function fakeDecrypt(str){
  // visual transform only (not a real cipher)
  return str.split('').reverse().join('').replace(/[a-zA-Z]/g, c => {
    const base = c === c.toUpperCase() ? 65 : 97;
    return String.fromCharCode(((c.charCodeAt(0) - base + 13) % 26) + base);
  });
}
decBtn.addEventListener('click', () => {
  const src = decInput.value || 'DATA';
  let frame = 0;
  const totalFrames = 18;
  decBtn.disabled = true;
  const interval = setInterval(() => {
    let scrambled = '';
    for(let i=0;i<src.length;i++){
      scrambled += Math.random() > frame/totalFrames ? SCRAMBLE[rand(0,SCRAMBLE.length-1)] : src[i];
    }
    decOut.textContent = scrambled;
    frame++;
    if(frame > totalFrames){
      clearInterval(interval);
      decOut.textContent = fakeDecrypt(src);
      decBtn.disabled = false;
    }
  }, 45);
});

/* ================= Interactive terminal ================= */
const termScroll = document.getElementById('termScroll');
const termInput = document.getElementById('termInput');
let history = [];
let historyIdx = -1;

function printLine(text, cls){
  const div = document.createElement('div');
  div.className = 'ln' + (cls ? ' '+cls : '');
  div.textContent = text;
  termScroll.appendChild(div);
  termScroll.scrollTop = termScroll.scrollHeight;
}
function printHtml(html, cls){
  const div = document.createElement('div');
  div.className = 'ln' + (cls ? ' '+cls : '');
  div.innerHTML = html;
  termScroll.appendChild(div);
  termScroll.scrollTop = termScroll.scrollHeight;
}
function delayedLines(lines, gap){
  let i = 0;
  function step(){
    if(i >= lines.length) return;
    printLine(lines[i].text, lines[i].cls);
    i++;
    setTimeout(step, gap);
  }
  step();
}

const HELP_TEXT = [
  'help                list available commands',
  'scan <target>       run a simulated port scan on target',
  'connect <target>    attempt a simulated connection to target',
  'trace <ip>          show a simulated traceroute',
  'ping <host>         run a simulated ping',
  'decrypt <text>      decrypt a string',
  'whoami              show current operator ID',
  'status              show system status',
  'matrix              insert a matrix display',
  'clear               clear the screen',
];

function handleCommand(raw){
  const trimmed = raw.trim();
  if(!trimmed) return;
  printLine('root@kagerou:~$ ' + trimmed, 'cmdline');
  history.push(trimmed);
  historyIdx = history.length;

  const parts = trimmed.split(/\s+/);
  const cmd = parts[0].toLowerCase();
  const arg = parts.slice(1).join(' ');

  switch(cmd){
    case 'help':
      HELP_TEXT.forEach(l => printLine(l, 'out2'));
      break;

    case 'clear':
      termScroll.innerHTML = '';
      break;

    case 'whoami':
      printLine('OPERATOR_ID: KAGE-0X7F  CLEARANCE: LEVEL-4', 'out');
      break;

    case 'status':
      printLine('LINK: ACTIVE / ENCRYPTION: ' + document.getElementById('cipherName').textContent, 'out');
      printLine('ACTIVE SESSIONS: ' + rand(2,9) + '  QUEUE: ' + rand(0,4), 'out2');
      break;

    case 'matrix': {
      let frames = 0;
      const iv = setInterval(() => {
        let row = '';
        for(let i=0;i<40;i++) row += CHARS[Math.floor(Math.random()*CHARS.length)];
        printLine(row, 'out2');
        frames++;
        if(frames > 4) clearInterval(iv);
      }, 80);
      break;
    }

    case 'scan': {
      const target = arg || randIp();
      printLine(`SCAN TARGET: ${target}`, 'out2');
      const ports = [22,80,443,3306,8080,5900].sort(()=>Math.random()-0.5).slice(0, rand(2,5));
      const lines = ports.map(p => ({ text:`  port ${p}/tcp ... ${Math.random()>0.4?'open':'filtered'}`, cls: Math.random()>0.4?'out':'out2' }));
      lines.push({ text:'SCAN COMPLETE', cls:'out' });
      delayedLines(lines, 220);
      break;
    }

    case 'connect': {
      const target = arg || randIp();
      printLine(`CONNECTING TO ${target} ...`, 'out2');
      delayedLines([
        { text:'  sending handshake...', cls:'out2' },
        { text:'  key exchange complete', cls:'out2' },
        { text:`SESSION ESTABLISHED  id=${randHex(8)}`, cls:'out' },
      ], 350);
      break;
    }

    case 'trace': {
      const target = arg || randIp();
      const hops = rand(4,7);
      printLine(`traceroute to ${target}`, 'out2');
      const lines = [];
      for(let i=1;i<=hops;i++){
        lines.push({ text:`  ${i}  ${randIp()}   ${rand(4,180)}ms`, cls:'out2' });
      }
      lines.push({ text:'TRACE COMPLETE', cls:'out' });
      delayedLines(lines, 200);
      break;
    }

    case 'ping': {
      const host = arg || randIp();
      const lines = [];
      for(let i=0;i<4;i++){
        lines.push({ text:`64 bytes from ${host}: icmp_seq=${i+1} time=${rand(4,120)}ms`, cls:'out2' });
      }
      delayedLines(lines, 260);
      break;
    }

    case 'decrypt': {
      const text = arg || 'NO-INPUT';
      printLine('Decrypting...', 'out2');
      setTimeout(() => printLine('RESULT: ' + fakeDecrypt(text), 'out'), 500);
      break;
    }

    case 'ls':
      printLine('logs/  keys/  payloads/  sandbox/  README.md', 'out2');
      break;

    case 'exit':
      printLine('SESSION TERMINATED (this console runs in your browser, so it will not actually close)', 'warnln');
      break;

    default:
      printLine(`command not found: ${cmd}  (type "help" for a list)`, 'errln');
  }
}

termInput.addEventListener('keydown', (e) => {
  if(e.key === 'Enter'){
    handleCommand(termInput.value);
    termInput.value = '';
  } else if(e.key === 'ArrowUp'){
    if(history.length){
      historyIdx = Math.max(0, historyIdx - 1);
      termInput.value = history[historyIdx] || '';
      e.preventDefault();
    }
  } else if(e.key === 'ArrowDown'){
    if(history.length){
      historyIdx = Math.min(history.length, historyIdx + 1);
      termInput.value = history[historyIdx] || '';
      e.preventDefault();
    }
  }
});

// boot sequence
printLine('KAGEROU-NET BREACH CONSOLE v3.0 booting...', 'out');
printLine('Initializing all modules...', 'out2');
setTimeout(() => printLine('SYSTEM READY. Type "help" to list commands.', 'out'), 500);
termInput.focus();
</script>
</body>
</html>
